[system]
compatible=embedlinux-raspberrypi0
bootloader=uboot
statusfile=/data/rauc.status

[keyring]
path=/usr/lib/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p5
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=ext4
bootname=B

[slot.kernel.0]
device=/dev/mmcblk0p2
type=raw
parent=rootfs.0

[slot.kernel.1]
device=/dev/mmcblk0p3
type=raw
parent=rootfs.1
