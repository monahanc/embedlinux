# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-embedlinux"
BBFILE_PATTERN_meta-embedlinux = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-embedlinux = "6"

LAYERDEPENDS_meta-embedlinux = "core"
LAYERSERIES_COMPAT_meta-embedlinux = "blacksail"
