# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-embedlinux"
BBFILE_PATTERN_meta-embedlinux = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-embedlinux = "6"

LAYERDEPENDS_meta-embedlinux = "core"
LAYERSERIES_COMPAT_meta-embedlinux = "blacksail"

# Enable UART serial console on Raspberry Pi boards
ENABLE_UART = "1"

# Enable U-Boot with FIT kernel images and A/B partitioning on Raspberry Pi
RPI_USE_U_BOOT = "1"
KERNEL_IMAGETYPE_UBOOT:rpi:arm = "zImage"
KERNEL_CLASSES:append:rpi = " kernel-fit-extra-artifacts"
WKS_FILE:rpi = "sdimage-raspberrypi-ab.wks"
WIC_CREATE_EXTRA_ARGS:append:rpi = " --no-fstab-update"
RPI_EXTRA_IMAGE_BOOT_FILES:rpi = "u-boot.bin;${SDIMG_KERNELIMAGE} boot.scr"

# FIT image kernel load/entry addresses and default DTB
UBOOT_LOADADDRESS:rpi ?= "0x00008000"
UBOOT_ENTRYPOINT:rpi ?= "0x00008000"
UBOOT_LOADADDRESS:rpi:aarch64 ?= "0x00080000"
UBOOT_ENTRYPOINT:rpi:aarch64 ?= "0x00080000"
FIT_CONF_DEFAULT_DTB:raspberrypi0 ?= "bcm2708-rpi-zero.dtb"
FIT_BOOT_CONFIG ??= ""
FIT_BOOT_CONFIG:raspberrypi0 ?= "#conf-bcm2708-rpi-zero.dtb#conf-dwc2.dtbo"
