[tools]
just = "latest"
python = "3.14"
uv = "latest"

[bootstrap.packages]
"pacman:chrpath" = "latest"
"pacman:diffstat" = "latest"
"pacman:inetutils" = "latest"
"pacman:rpcsvc-proto" = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv pip install -r requirements.txt"
